# nginx reverse proxy for ShopFlow -- runs on vcf-frontend01.
# Install to /etc/nginx/conf.d/shopflow.conf (and remove/disable the
# default server block so it doesn't clash on port 80).

upstream shopflow_middle {
    server vcf-middle01:8080 max_fails=2 fail_timeout=5s;
    keepalive 16;
}

# stub_status so Telegraf's inputs.nginx can scrape connection/request
# counters -- see monitoring/telegraf-frontend.conf
server {
    listen 8081;
    location /nginx_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }
}

server {
    listen 80 default_server;
    server_name _;

    access_log /var/log/nginx/shopflow-access.log;
    error_log  /var/log/nginx/shopflow-error.log;

    # Deliberately not generous: once the middle tier starts blocking on
    # an exhausted DB pool, requests should time out and surface as 504s
    # at the frontend within a bounded window rather than piling up
    # indefinitely.
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;

    location / {
        proxy_pass http://shopflow_middle;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
