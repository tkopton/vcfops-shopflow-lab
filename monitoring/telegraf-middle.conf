# Reference Telegraf input block for vcf-middle01 (API + worker + local
# Redis all run here). In the VCF Operations UI: Add Service > Redis,
# pointing at localhost:6379. No app-level service to add -- there's no
# custom metrics endpoint on this tier by design; the API and worker
# processes are visible to VCF Operations only through OS-level metrics
# (CPU/mem, useful for noticing e.g. the worker process's memory/handle
# growth) and through what Redis and Postgres report about themselves.
#
# keyspace_hits / keyspace_misses (rate) is what shows the cache-stampede
# pattern: every FEATURED_TTL seconds (default 8s) you'll see a small,
# sharp spike in misses, then a return to an almost-all-hits baseline
# until the next expiry -- a separate, faster rhythm than the
# connection-leak cycle you'll see on vcf-db01.
#
# Optional: a one-line inputs.exec to surface the order queue depth
# without adding any library to the app itself.

[[inputs.redis]]
  servers = ["tcp://localhost:6379"]
  interval = "5s"

[[inputs.exec]]
  commands = ["redis-cli -h localhost llen shopflow:orders"]
  name_override = "shopflow_queue_depth"
  data_format = "value"
  data_type = "integer"
  interval = "5s"

[[inputs.cpu]]
  percpu = false
  totalcpu = true
  interval = "5s"

[[inputs.mem]]
  interval = "5s"

[[inputs.processes]]
  interval = "5s"
