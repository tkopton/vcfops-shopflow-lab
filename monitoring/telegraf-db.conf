# Reference Telegraf input block for vcf-db01.
#
# In the VCF Operations UI this is normally added as a supported
# "PostgreSQL" application service (Environment > the vcf-db01 agent >
# Add Service > PostgreSQL), which prompts for host/port/credentials and
# provisions an equivalent block to this one. If your build doesn't
# template it, add the block directly.
#
# The single most telling out-of-the-box metric here is
# postgresql_numbackends approaching max_connections. Cross-reference it
# with a custom query for idle-in-transaction sessions (below) to
# distinguish "busy DB" from "leaking connections that are doing nothing".

[[inputs.postgresql]]
  address = "host=localhost user=telegraf password=telegraf sslmode=disable dbname=shopflow"
  interval = "5s"

# Custom query input: count of long-idle-in-transaction sessions, which is
# the direct fingerprint of the seeded bug. This requires a read-only
# monitoring role with pg_monitor (or similar) granted. Broken down by
# application_name so it's immediately obvious this is a shopflow-worker
# problem, not shopflow-api -- see common/dbutil.py for how each process
# tags its own connections.
[[inputs.postgresql_extensible]]
  address = "host=localhost user=telegraf password=telegraf sslmode=disable dbname=shopflow"
  interval = "5s"
  [[inputs.postgresql_extensible.query]]
    sqlquery = """
      SELECT application_name,
             count(*) AS idle_in_txn_count,
             COALESCE(EXTRACT(EPOCH FROM max(now() - state_change)), 0) AS idle_in_txn_max_age_s
      FROM pg_stat_activity
      WHERE datname = 'shopflow' AND state = 'idle in transaction'
      GROUP BY application_name
    """
    version = 901
    withdbname = false
    tagvalue = "application_name"
    measurement = "shopflow_db_idle_in_txn"

[[inputs.cpu]]
  percpu = false
  totalcpu = true
  interval = "5s"

[[inputs.mem]]
  interval = "5s"

[[inputs.diskio]]
  interval = "5s"
