# Reference Telegraf input block for vcf-frontend01.
# In the VCF Operations UI this is normally added as a supported "NGINX"
# application service (Environment > the vcf-frontend01 agent > Add
# Service > NGINX), pointing at http://localhost:8081/nginx_status (see
# frontend/nginx-shopflow.conf for the stub_status block this scrapes).
# If your build doesn't template it, add the block directly.
#
# nginx 5xx / connection counts are the user-facing symptom here: they
# lag the DB pool exhaustion on vcf-db01 by roughly the sum of
# proxy_connect_timeout + the time the middle tier spends blocked
# waiting on pool.getconn() -- a useful timeline anchor when correlating
# across tiers. Optionally, add an inputs.tail (with a grok pattern
# matching the default combined log format plus $request_time) against
# /var/log/nginx/shopflow-access.log if you want per-request latency
# percentiles rather than just connection counters.

[[inputs.nginx]]
  urls = ["http://localhost:8081/nginx_status"]
  interval = "5s"

[[inputs.cpu]]
  percpu = false
  totalcpu = true
  interval = "5s"

[[inputs.mem]]
  interval = "5s"

[[inputs.net]]
  interval = "5s"
